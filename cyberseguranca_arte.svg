<path class="circuit" d="M650 460 H580 V495"/>
<circle class="node" cx="580" cy="460" r="3.5"/>
</g>
<g>
<text class="kw" x="34" y="130">function</text><text class="code" x="112" y="130"> login() {</text>
<text class="code-dim" x="46" y="150">if (senha</text><text class="code-bright" x="114" y="150"> === hash)</text>
<text class="code" x="46" y="170">  return true;</text>
<text class="code-dim" x="34" y="190">}</text>
<text class="kw" x="30" y="225">const</text><text class="code" x="72" y="225"> firewall</text>
<text class="code-dim" x="34" y="245">  = ativo;</text>
<text class="kw" x="30" y="400">try {</text>
<text class="code" x="42" y="420">  conectar();</text>
<text class="kw" x="30" y="440">} catch(e) {</text>
<text class="code-bright" x="42" y="460">  bloquear(e);</text>
<text class="code-dim" x="30" y="480">}</text>
</g>
<g>
<text class="code-dim" x="540" y="120">&lt;/&gt; crypto</text>
<text class="kw" x="552" y="150">while</text><text class="code" x="600" y="150">(1) {</text>
<text class="code" x="564" y="170">  scan();</text>
<text class="code-dim" x="552" y="190">}</text>
<text class="code-dim" x="540" y="230">0110 1001</text>
<text class="kw" x="546" y="390">if</text><text class="code" x="566" y="390">(risco)</text>
<text class="code-bright" x="558" y="410">  alerta();</text>
<text class="kw" x="546" y="440">else</text>
<text class="code" x="558" y="460">  libera();</text>
<text class="code-dim" x="540" y="490">0xFF2A</text>
</g>
