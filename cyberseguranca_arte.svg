.lock-shackle{fill:none;stroke:#8ff0e2;stroke-width:5;stroke-linecap:round}
.keyhole{fill:#070b10}
.spark{fill:#8ff0e2}
</style>
<rect class="bg" x="0" y="0" width="680" height="540" rx="16"/>
