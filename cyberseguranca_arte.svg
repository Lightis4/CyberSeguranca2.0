<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<clipPath id="shieldClip">
<path d="M340 60 L520 120 L520 290 Q520 420 340 480 Q160 420 160 290 L160 120 Z"/>
</clipPath>
</defs>
<style>
.bg{fill:#070b10}
